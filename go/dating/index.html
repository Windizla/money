<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self';">
<title>Redirecting…</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/brand-mark.png">
</head>
<body>
<a class="skip-link" href="#main">Skip</a>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Furlore</span></a>
      <div class="nav-actions">
        <a href="/" class="btn btn-ghost btn-sm">← Back to Furlore</a>
      </div>
    </nav>
  </div>
</header>

<main id="main">
  <div class="container section center" style="padding-top:var(--s-10)">
    <div class="card" style="max-width:560px;margin:0 auto;text-align:left">
      <div style="text-align:center;margin-bottom:var(--s-5)">
        <div style="font-size:3rem;margin-bottom:var(--s-3)" aria-hidden="true">🐾</div>
        <h1 id="redirect-title" style="font-size:1.6rem;margin-bottom:var(--s-2)">Taking you there…</h1>
        <p id="geo-msg" class="muted">If nothing happens in a couple of seconds, please use the button below.</p>
      </div>

      <div id="geo-actions" style="display:none;text-align:center;margin-top:var(--s-5)">
        <a href="/community/online/" class="btn btn-primary">Join community platforms instead</a>
        <div style="margin-top:var(--s-4)"><a href="/" class="dim small">← Back to home</a></div>
      </div>

      <noscript>
        <div class="callout callout-warn">
          <div class="callout-title">JavaScript is disabled</div>
          <p class="muted">The redirect requires JavaScript. You can <a href="/community/online/">browse community platforms</a> instead, or enable JavaScript and try again.</p>
        </div>
      </noscript>

      <p class="small dim" style="text-align:center;margin-top:var(--s-5)">
        By continuing you confirm you are 18 or older. See our <a href="/privacy/">privacy policy</a>.
      </p>
    </div>
  </div>
</main>

<script src="/assets/js/affiliate.js" defer></script>
</body>
</html>
